name: Daily Commits

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Update Activity File
        run: |
          echo "Last active: $(date)" >> activity.txt

      - name: Commit and Push Changes
        run: |
          # Use the repository owner's identity to ensure commits count towards the contribution graph
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add activity.txt
          git commit -m "Automated daily commit to improve contribution graph"
          git push
